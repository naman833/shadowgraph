<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">ShadowGraph architecture</title>
  <desc id="description">A pull request flows through deterministic change detection, live DataHub context, true consumer classification, DuckDB counterfactual replay, policy decision, and evidence publication.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="28" x2="1510" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17211D"/>
      <stop offset="1" stop-color="#24342C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#07110C" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11V0Z" fill="#D9F478"/>
    </marker>
    <style>
      .label { font: 700 22px Arial, sans-serif; fill: #17211D; }
      .detail { font: 400 16px Arial, sans-serif; fill: #65716B; }
      .eyebrow { font: 800 13px Arial, sans-serif; letter-spacing: 1.7px; fill: #167553; }
      .light-label { font: 700 22px Arial, sans-serif; fill: #F6F8F4; }
      .light-detail { font: 400 16px Arial, sans-serif; fill: #BFCBC4; }
      .number { font: 800 14px Arial, sans-serif; fill: #17211D; }
      .output { font: 700 18px Arial, sans-serif; fill: #17211D; }
    </style>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#background)"/>
  <circle cx="1470" cy="84" r="170" fill="#D9F478" fill-opacity=".07"/>
  <circle cx="132" cy="658" r="210" fill="#167553" fill-opacity=".12"/>

  <text x="72" y="76" class="light-label" font-size="28">ShadowGraph</text>
  <text x="72" y="108" class="light-detail">DataHub-powered pre-merge safety for organizational data</text>

  <g filter="url(#shadow)">
    <rect x="70" y="200" width="190" height="166" rx="20" fill="#F6F8F4"/>
    <rect x="92" y="222" width="38" height="38" rx="10" fill="#17211D"/>
    <path d="M103 241H119M111 233V249" stroke="#D9F478" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="292" class="eyebrow">INPUT</text>
    <text x="92" y="325" class="label">GitHub PR</text>
    <text x="92" y="350" class="detail">Immutable base/head SHA</text>
  </g>

  <path d="M260 283H320" stroke="#D9F478" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="170" width="225" height="226" rx="20" fill="white"/>
    <circle cx="370" cy="210" r="20" fill="#D9F478"/>
    <text x="365" y="216" class="number">1</text>
    <text x="360" y="260" class="eyebrow">DETECT</text>
    <text x="360" y="294" class="label">Understand change</text>
    <text x="360" y="328" class="detail">SQL · dbt · schema</text>
    <text x="360" y="354" class="detail">Columns · expressions</text>
    <text x="360" y="380" class="detail">Files bounded and validated</text>
  </g>

  <path d="M555 283H615" stroke="#D9F478" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="625" y="144" width="250" height="278" rx="20" fill="#E9F5EF"/>
    <circle cx="665" cy="184" r="20" fill="#167553"/>
    <text x="660" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="white">2</text>
    <text x="655" y="236" class="eyebrow">DATAHUB CONTEXT</text>
    <text x="655" y="270" class="label">Resolve and trace</text>
    <text x="655" y="306" class="detail">Canonical dataset URNs</text>
    <text x="655" y="332" class="detail">Schema and column lineage</text>
    <text x="655" y="358" class="detail">Bounded one-hop BFS</text>
    <text x="655" y="384" class="detail">Owners and criticality</text>
  </g>

  <path d="M875 283H935" stroke="#D9F478" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="945" y="170" width="225" height="226" rx="20" fill="white"/>
    <circle cx="985" cy="210" r="20" fill="#D9F478"/>
    <text x="980" y="216" class="number">3</text>
    <text x="975" y="260" class="eyebrow">CLASSIFY</text>
    <text x="975" y="294" class="label">True consumers</text>
    <text x="975" y="328" class="detail">Column lineage first</text>
    <text x="975" y="354" class="detail">SQL-reference fallback</text>
    <text x="975" y="380" class="detail">Exclude false positives</text>
  </g>

  <path d="M1170 283H1230" stroke="#D9F478" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1240" y="170" width="290" height="226" rx="20" fill="#FFF5DC"/>
    <circle cx="1280" cy="210" r="20" fill="#A46A11"/>
    <text x="1275" y="216" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="white">4</text>
    <text x="1270" y="260" class="eyebrow" fill="#A46A11">REPLAY + DECIDE</text>
    <text x="1270" y="294" class="label">DuckDB shadow run</text>
    <text x="1270" y="328" class="detail">Before/after same inputs</text>
    <text x="1270" y="354" class="detail">Metrics · nulls · drift</text>
    <text x="1270" y="380" class="detail">PASS · BLOCK · INCONCLUSIVE</text>
  </g>

  <path d="M1385 396V468" stroke="#D9F478" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="492" width="250" height="136" rx="18" fill="#FFF0ED"/>
    <circle cx="1160" cy="532" r="18" fill="#C84036"/>
    <path d="M1152 532L1158 538L1169 525" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1190" y="538" class="output">GitHub Check</text>
    <text x="1150" y="576" class="detail">Commit-scoped evidence</text>
    <text x="1150" y="600" class="detail">Owner routing + merge gate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1390" y="492" width="140" height="136" rx="18" fill="#E9F5EF"/>
    <circle cx="1430" cy="532" r="18" fill="#167553"/>
    <path d="M1422 532H1438M1430 524V540" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="1415" y="576" class="output">DataHub</text>
    <text x="1415" y="600" class="detail">Evidence</text>
  </g>

  <g>
    <rect x="625" y="500" width="385" height="112" rx="18" stroke="#91A098" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="655" y="542" class="light-label" font-size="18">Optional local Ollama explanation</text>
    <text x="655" y="572" class="light-detail">Advisory only · never changes the deterministic decision</text>
  </g>

  <text x="72" y="670" class="light-detail">DETECT → RESOLVE → TRACE → REPLAY → COMPARE → DECIDE → RECORD</text>
</svg>
